<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slime Agent Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f2f1ed; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #part-label {
        position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 6px;
        font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: rgba(20, 22, 28, 0.82); color: #e9fffd; pointer-events: none; display: none;
      }
      #hint {
        position: fixed; right: 12px; bottom: 12px; color: #6b6b6b;
        font: 12px/1.3 system-ui, sans-serif; pointer-events: none; display: none;
      }
      /* Visitor control panel (src/hud.ts); the open panel carries the hint itself. */
      body.hud-open #hint { display: none !important; }
      .hud {
        position: fixed; top: 16px; left: 16px; z-index: 10; box-sizing: border-box;
        width: min(340px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto;
        border-radius: 10px; background: rgba(20, 22, 28, 0.82); color: #e9fffd;
        font: 12px/1.35 system-ui, sans-serif; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
        -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      }
      .hud:not([open]) { width: auto; max-width: calc(100vw - 32px); }
      .hud-title {
        display: flex; align-items: baseline; gap: 6px; padding: 8px 12px; cursor: pointer;
        list-style: none; user-select: none;
      }
      .hud-title::-webkit-details-marker { display: none; }
      .hud-title::after { content: '\25BE'; margin-left: auto; padding-left: 6px; color: #9fb7b4; }
      .hud:not([open]) .hud-title::after { content: '\25B8'; }
      .hud-title:focus-visible { outline: 2px solid #03d4cc; outline-offset: -2px; border-radius: 10px; }
      .hud-sub { color: #9fb7b4; }
      .hud-body { display: grid; gap: 7px; padding: 0 12px 11px; }
      .hud-hint { color: #9fb7b4; }
      .hud-row { display: flex; align-items: flex-start; gap: 8px; }
      .hud-k {
        flex: 0 0 34px; padding-top: 4px; color: #7f9794;
        font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
      }
      .hud-chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
      .hud-chip {
        display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px;
        border: 1px solid rgba(233, 255, 253, 0.2); color: inherit; text-decoration: none; white-space: nowrap;
      }
      a.hud-chip:hover { background: rgba(233, 255, 253, 0.1); }
      a.hud-chip:focus-visible { outline: 2px solid #03d4cc; outline-offset: 1px; }
      .hud-chip[aria-current] { background: #e9fffd; border-color: #e9fffd; color: #14161c; }
      .hud-chip[aria-disabled] { opacity: 0.38; cursor: not-allowed; }
      .hud-toggle::before {
        content: ''; width: 8px; height: 8px; border-radius: 2px; box-sizing: border-box;
        border: 1.5px solid currentColor; opacity: 0.7;
      }
      .hud-toggle.on { border-color: rgba(3, 212, 204, 0.75); }
      .hud-toggle.on::before { background: #03d4cc; border-color: #03d4cc; opacity: 1; }
      .hud-swatch { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35); }
      @media (pointer: coarse) { .hud-chip { padding: 6px 10px; } .hud-k { padding-top: 7px; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="part-label"></div>
    <div id="hint">drag to orbit &middot; click a part to name it</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
